<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Categories</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <link rel="stylesheet" href="./Css/base.css" />
    <link rel="stylesheet" href="./Css/style.css" />
    
  </head>

  <body>
  
    <header>
      <nav >
        <div class="logo">
          <a href="index.html">
            <span class="logo-text">Categories Shop</span>
          </a>
        </div>
        <ul class="nav-links">
          <li><a href="./categories.html">Categories</a></li>
          <li><a href="./products.html">Proudcts</a></li>
        </ul>
      </nav>
    </header>
  
    <main>
       <div
      class="position-fixed top-50 start-50 translate-middle d-flex justify-content-center align-items-center overlay-layer">
      <div class="spinner spinner-border text-primary d-none custom-spinner" role="status">
        <span class="visually-hidden"></span>
      </div>
    </div>
      <div class="container">
        <div class="search">
          <input
            type="text"
            class="search-input"
            placeholder="Search for products..."
          />
          <button class="search-button">Search</button>
        </div>
        <div class="tob-categories">
          <h1>Top Categories</h1>
          <div class="categories-list"></div>
          <div class="showAll-Categories">
            <a href="./categories.html" class="showAll-btn"
              >Show All Categories</a
            >
          </div>
        </div>
        <div class="top-products">
          <h1>Top Products</h1>
          <div class="products-list"></div>
          <div class="showAll-Products">
            <a href="./products.html" class="showAll-btn">Show All Products</a>
          </div>
        </div>
        
      </div>
          <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

      <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
      <script src="./JS/main.js"></script>
    </main>
  </body>
</html>
