<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="./Css/base.css" />
    <link rel="stylesheet" href="./Css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
</head>
<body>
    <header>
      <nav >
        <div class="logo">
          <a href="index.html">
            <span class="logo-text">Categories Shop</span>
          </a>
        </div>
        <ul class="nav-links">
          <li><a href="./categories.html">Categories</a></li>
          <li><a href="./products.html">Proudcts</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <div 
  class="position-fixed top-50 start-50 translate-middle d-flex justify-content-center align-items-center"
  style="z-index: 1050;">
  <div class=" spinner spinner-border text-primary d-none" role="status" style="width: 4rem; height: 4rem;">
    <span class="visually-hidden"></span>
  </div>
</div>
        <div class="container">
          <div class="sortProudcts">

        <label for="sortBy">Sort by:</label>
        <select id="sortBy">
          <option value="title">Title</option>
          <option value="price">Price</option>
          <option value="rating">Rating</option>
          <option value="stock">Stock</option>
          <option value="brand">Brand</option>
          <option value="category">Category</option>
        </select>

        <label for="order">Order:</label>
        <select id="order">
          <option value="asc">Ascending</option>
          <option value="desc">Descending</option>
        </select>

        <button id="sortBtn">Apply</button>
      </div>
          <div class="products-list"></div>
          <div class="myModal">
          <div class="modal-img">
            <i class="fa-solid fa-arrow-left left-btn"></i>

            <img src="" alt="Product Image" class="modal-image" />
            <i class="fa-solid fa-xmark close-btn"></i>
            <i class="fa-solid fa-arrow-right right-btn "></i>
          </div>
        </div>
        <div class="pagination-list">
            <ul class="pagination">
                
            </ul>
        </div>
            </div>




    </main>
          

   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
     <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="./JS/products.js"></script>
</body>
</html>
